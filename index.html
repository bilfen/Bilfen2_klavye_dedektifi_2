  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

        #keyboard-app {
            margin: 0;
            padding: 0;
            width: 100%;

            width: 100%;
            height: 18%;

        }

        .main-title-container {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            text-align: center;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.6));
        }

        .main-title {
            font-family: 'Grandstander', 'Fredoka', sans-serif;
            font-weight: 800;

            -webkit-text-stroke: 3px #c0392b;

                3px 3px 0px #8B0000,
                -2px -2px 0px #8B0000,

                2px 2px 0px #8B0000,
                0px 6px 12px rgba(0,0,0,0.6);

            line-height: 1.1;
            display: inline-block;
            position: relative;
            letter-spacing: 2px;
        }

        .gear-icon {

            animation: spin 10s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .board-container {
            position: absolute;
            top: 14%;
            left: 25%;
            right: 2%;
            bottom: 15%;
            background-color: #e8d0a9; /* Cork/paper color */
            border: 18px solid #6b4423;
            border-radius: 30px;

        /* Top Plaque on the board */

            background: linear-gradient(180deg, #fcecd5 0%, #e6cfa8 100%);

            border-radius: 20px;
            padding: 4px 20px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            display: inline-block;
            margin: -10px auto 5px auto;
            position: relative;
            z-index: 11;

        .btn-3d {
            transition: all 0.1s;
            position: relative;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #000, 0 2px 4px rgba(0,0,0,0.4) !important;
        }

        .nav-btn {
            background: linear-gradient(180deg, #5dade2 0%, #2980b9 100%);
            border: 4px solid #1a5276;
            border-radius: 16px;

            padding: 8px 24px;
            font-size: 1.2rem;

        .nav-btn.red {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);

            border-color: #196f3d;

        }

        .game-target {
            background: linear-gradient(180deg, #788591 0%, #4a5560 100%);
            border: 3px solid #2d3748;
            border-bottom-width: 6px;
            border-radius: 10px;
            color: white;
            width: auto;
            min-width: clamp(35px, 5vw, 65px);

            z-index: 10;

        .type-input {
            background: #fff;
            border: 6px solid #8b5a2b;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            font-weight: 600;
            color: #4a2e15;
            text-align: center;

            transition: all 0.2s;
            outline: none;
        }
        .type-input.error {
            background: #ffebee;
            border-color: #c62828;
            color: #c62828;
            animation: shake 0.4s both;
        }
        .type-input.success {
            background: #e8f5e9;
            border-color: #2e7d32;
            color: #2e7d32;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .top-badge {
            background: #c28851;

            border-radius: 12px;

        /* Fox position */
        .fox-container {
            position: absolute;
            bottom: 12%;
            left: 2%;
            width: 25%;
            max-width: 350px;
            z-index: 20;
            pointer-events: none;
            filter: drop-shadow(10px 10px 15px rgba(0,0,0,0.5));
        }

        @media (max-width: 900px) {
            .board-container { left: 4%; }
            .fox-container { display: none; }
        }

#keyboard-app h1.main-title,#keyboard-app #successScreen h2{font-family:'Fredoka',Arial,sans-serif;font-weight:700;-webkit-text-stroke:0!important;text-shadow:0 3px 5px rgba(0,0,0,.3);letter-spacing:1px}

#keyboard-app #menuScreen .justify-between&gt;span:first-child{flex:1;text-align:center}
#keyboard-app #gameScreen{min-height:0;height:auto;overflow-y:auto;justify-content:flex-start;padding:12px 16px 20px}
#keyboard-app #gameScreen&gt;p{margin:8px 0 16px;flex-shrink:0}
#keyboard-app #targetSequence{margin-bottom:16px;flex-shrink:0}
#keyboard-app #gameScreen&gt;div:last-child{width:100%;flex-shrink:0}
#keyboard-app #hintBox{margin-top:12px;padding:10px 16px;max-width:min(100%,28rem);overflow-wrap:anywhere;flex-shrink:0}
#keyboard-app #hintText{display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.5}
#keyboard-app #hintText .hint-target{display:block;max-width:100%;margin:0;padding:4px 12px;background:#fff;border-radius:6px;font-size:1.5rem;line-height:1.5;overflow-wrap:anywhere}
#keyboard-app #gameInput{max-width:100%!important}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4']){overflow-x:hidden}
#keyboard-app #targetSequence[data-level='4']{max-height:160px;min-height:0;overflow-y:auto;flex-shrink:1;padding:10px 12px}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4'])&gt;div:last-child{min-width:0;width:100%;max-width:100%}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4']) #gameInput{width:min(400px,100%)!important;box-sizing:border-box;font-size:1.75rem!important;padding:8px;min-width:0}
#keyboard-app #gameScreen #targetSequence[data-level='2']{display:flex;flex-wrap:nowrap;justify-content:center;gap:4px;width:100%;max-width:100%;overflow:visible;align-items:center;padding:12px 12px}
#keyboard-app #gameScreen #targetSequence[data-level='2'] .game-target{width:42px;flex:0 1 42px;min-width:30px;height:74px;max-width:100%;padding-inline:5px;font-size:2rem!important}
#keyboard-app #gameScreen #targetSequence[data-level='2'] .game-target[data-kind='word']{width:max-content;flex:0 0 auto;font-size:1.8rem!important;padding-inline:8px}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4']) #hintBox{width:100%;max-width:min(100%,36rem)}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4']) #hintText{display:block;width:100%;text-align:center;line-height:1.6;white-space:normal}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4']) #hintText strong{display:inline}
#keyboard-app #gameScreen:has(#targetSequence[data-level='4']) #hintText span{display:inline-block;max-width:100%;margin:8px 0 0;padding:4px 12px}
#keyboard-app #gameScreen #targetSequence[data-level='2'] .game-target.active{transform:translateY(-5px)}
#keyboard-app #gameScreen #targetSequence[data-level='2'] .game-target.success{transform:none;min-width:36px;padding:0!important;overflow:visible;justify-content:center;align-items:center}
#keyboard-app #gameScreen #targetSequence[data-level='2'] .game-target .fa-check{display:block;font-size:24px!important;line-height:1;width:24px;text-align:center;flex:0 0 24px}
#keyboard-app .main-title-container{left:61.5%;width:73%}
#keyboard-app>div:has(>#bottomNavBar){left:25%;width:73%;padding-inline:0}
#keyboard-app #bottomNavBar{padding-left:0!important}
#keyboard-app #mainActionBtn{margin-left:0!important}
@media(max-width:900px){#keyboard-app .main-title-container{left:51%;width:94%}#keyboard-app>div:has(>#bottomNavBar){left:4%;width:94%}}
#keyboard-app #targetSequence[data-level=&quot;2&quot;]{flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;padding:12px 8px}
#keyboard-app #targetSequence[data-level=&quot;2&quot;] .game-target{flex-shrink:0;width:max-content;min-width:35px;max-width:none;padding-inline:8px}

                &lt;div class=&quot;flex-1 bg-[#d8c29d] border-4 border-[#8b5a2b] rounded-2xl p-3 shadow-inner relative mt-4&quot;&gt;
                    &lt;div class=&quot;absolute -top-4 left-1/2 transform -translate-x-1/2 bg-[#8b5a2b] text-white px-3 py-1 rounded-full text-sm font-bold shadow-md border-2 border-[#5e3818] whitespace-nowrap&quot;&gt;
                        &lt;i class=&quot;fas fa-star text-yellow-400 mr-1&quot;&gt;&lt;/i&gt; BÖLÜM 2: ALT GR SIRLARI
                    &lt;/div&gt;
                    &lt;div class=&quot;mt-4 flex flex-col gap-1 font-semibold text-base text-[#4a2e15]&quot;&gt;
                        &lt;div class=&quot;flex justify-between items-center bg-[#e8d0a9] p-1.5 rounded border border-[#c28851]&quot;&gt;&lt;span&gt;Alt Gr + 3&lt;/span&gt; &lt;span class=&quot;bg-white px-2 rounded shadow&quot;&gt;#&lt;/span&gt;&lt;/div&gt;
                        &lt;div class=&quot;flex justify-between items-center bg-[#e8d0a9] p-1.5 rounded border border-[#c28851]&quot;&gt;&lt;span&gt;Alt Gr + 4&lt;/span&gt; &lt;span class=&quot;bg-white px-2 rounded shadow&quot;&gt;$&lt;/span&gt;&lt;/div&gt;
                        &lt;div class=&quot;flex justify-between items-center bg-[#e8d0a9] p-1.5 rounded border border-[#c28851]&quot;&gt;&lt;span&gt;Alt Gr + 7&lt;/span&gt; &lt;span class=&quot;bg-white px-2 rounded shadow&quot;&gt;{&lt;/span&gt;&lt;/div&gt;
                        &lt;div class=&quot;flex justify-between items-center bg-[#e8d0a9] p-1.5 rounded border border-[#c28851]&quot;&gt;&lt;span&gt;Alt Gr + 0&lt;/span&gt; &lt;span class=&quot;bg-white px-2 rounded shadow&quot;&gt;}&lt;/span&gt;&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;div id=&quot;gameScreen&quot; class=&quot;hidden flex-grow flex-col items-center justify-center p-4 relative w-full h-full&quot;&gt;
            &lt;p class=&quot;text-lg sm:text-xl text-[#8b5a2b] font-bold mb-6 mt-4 text-center&quot;&gt;İstenilen simgeleri klavyede bul ve yaz!&lt;/p&gt;
            
            &lt;div id=&quot;targetSequence&quot; class=&quot;flex flex-nowrap justify-center gap-1 sm:gap-2 md:gap-3 mb-6 w-full px-2 overflow-visible&quot;&gt;
                &lt;!-- Targets will be injected here --&gt;
            &lt;/div&gt;

            &lt;div class=&quot;flex flex-col items-center&quot;&gt;
                &lt;label for=&quot;gameInput&quot; class=&quot;text-[#8b5a2b] font-bold text-xl mb-2&quot;&gt;&lt;i class=&quot;fas fa-keyboard mr-2&quot;&gt;&lt;/i&gt;Buraya Yazın&lt;/label&gt;
                &lt;input type=&quot;text&quot; id=&quot;gameInput&quot; class=&quot;type-input&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; placeholder=&quot;...&quot;&gt;
                
                &lt;div id=&quot;hintBox&quot; class=&quot;hidden mt-6 bg-[#fff3e0] border-4 border-[#ffb74d] rounded-xl px-6 py-3 shadow-md max-w-md text-center&quot;&gt;
                    &lt;span class=&quot;text-[#e65100] font-bold block mb-1&quot;&gt;&lt;i class=&quot;fas fa-lightbulb&quot;&gt;&lt;/i&gt; Dedektif İpucu&lt;/span&gt;
                    &lt;span id=&quot;hintText&quot; class=&quot;text-[#4e342e] font-bold&quot;&gt;&lt;/span&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
        
        &lt;!-- SUCCESS SCREEN --&gt;
        &lt;div id=&quot;successScreen&quot; class=&quot;hidden absolute inset-0 bg-[#e8d0a9] bg-opacity-95 z-40 flex-col items-center justify-center backdrop-blur-sm&quot;&gt;
             &lt;i class=&quot;fas fa-trophy text-8xl text-yellow-500 drop-shadow-xl mb-6 animate-bounce&quot;&gt;&lt;/i&gt;
             &lt;h2 class=&quot;text-6xl text-[#e65100] font-black mb-4 px-6 py-2 rounded-2xl bg-[#fcecd5] border-4 border-yellow-400 drop-shadow-md&quot; style=&quot;-webkit-text-stroke: 3px #eab308;&quot;&gt;HARİKA!&lt;/h2&gt;
             &lt;p class=&quot;text-2xl text-[#6b4423] font-bold mb-8&quot;&gt;Bölümü başarıyla tamamladın.&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;absolute bottom-2 sm:bottom-4 left-0 w-full flex justify-center px-4 sm:px-8 z-50&quot;&gt;
        &lt;div id=&quot;bottomNavBar&quot; class=&quot;flex items-center justify-center w-full max-w-5xl&quot; style=&quot;padding-left: 60px;&quot;&gt;
            &lt;button id=&quot;backBtn&quot; onclick=&quot;showMenu()&quot; class=&quot;btn-3d nav-btn red hidden items-center gap-2 text-sm sm:text-lg px-4 py-2 sm:px-6 sm:py-3&quot;&gt;
                &lt;i class=&quot;fas fa-caret-left text-xl&quot;&gt;&lt;/i&gt; Geri
            &lt;/button&gt;
            &lt;button id=&quot;mainActionBtn&quot; onclick=&quot;startLevel(1)&quot; class=&quot;btn-3d nav-btn green flex items-center gap-2 text-base sm:text-xl px-6 py-2 sm:px-8 sm:py-3 ml-[-1rem] sm:ml-[-2.5rem]&quot;&gt;
                &lt;span id=&quot;mainActionText&quot;&gt;Etkinliğe Başla&lt;/span&gt; &lt;i class=&quot;fas fa-play&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // --- GAME DATA ---
        const levels = [
            { id: 1, title: &quot;1. Bölüm: SHIFT Gücü&quot;, targets: ['!', '+', '%', '&amp;', '=', '?', ';', ':', '\''] },
            { id: 2, title: &quot;2. Bölüm: SHIFT Ya Da Caps Lock İle Yap&quot;, targets: ['B', 'i', 'l', 'F', 'E', 'n', '2.sınıf', 'Bilişim', 'TEKNOLOJİ'] },
            { id: 3, title: &quot;3. Bölüm: Alt Gr Tuşu İle Yap&quot;, targets: ['#', '$', '{', '}', '[', ']', '\\', '@'] },
            { id: 4, title: &quot;4. Bölüm: Nazik Robo (Yazı Yazalım)&quot;, targets: &quot;NAZİK ROBO Fatih’in babası robotik mühendisiydi. Yeni bir robot üzerinde çalışıyordu. Bu robotu insanlara yardım etmesi için tasarlayacaktı. Uzun çalışmalarının sonunda robotu tamamladı. Ona “Robo” adını verdi. Robo’yu denemek için eve getirdi. Fatih önce Robo’dan korktu. Sonra onunla vakit geçirince korkusu geçti. Robo, Fatih’in her dediğini yapıyordu. Mesela Fatih, Robo’dan masayı silmesini istedi. Robo hemen masayı sildi. Çiçekleri sulamasını istedi. Robo çiçekleri suladı. Bir sabah Fatih düştü. Robo hemen yardım etti. Fatih’i yerden kaldırdı. O sırada Fatih’in dikkatini bir şey çekti. Robo ona “Geçmiş olsun.” dememişti. Hatta kimseye “Merhaba!” diyemiyor, teşekkür etmiyordu. Fatih, bu durumu babasına anlattı. Babası gülümsedi. “Harikasın Fatih! O halde Robo’ya bir de nezaket özelliği ekleyelim.” dedi. Babası bu özelliği ekledikten sonra Robo her sabah “Günaydın!” demeye başladı. Yemek sonrasında “Afiyet olsun!”, uyumadan önce “İyi uykular!” diyordu. Robo, artık nazik bir robot olmuştu. Fatih, Robo’nun adını “Nazik Robo” olarak değiştirdi. İnsanlara yardımcı olmak güzeldi ama nezaketle davranmak daha da güzeldi.&quot;.split(' ').filter(w =&gt; w.trim() !== '') }
        ];

        const hintsMap = {
            '!': 'SHIFT + 1', '+': 'SHIFT + 4', '%': 'SHIFT + 5', '&amp;': 'SHIFT + 6',
            '=': 'SHIFT + 0', '?': 'SHIFT + *', ';': 'SHIFT + ,', ':': 'SHIFT + .', '\'': 'SHIFT + 2',
            '#': 'Alt Gr + 3', '$': 'Alt Gr + 4', '{': 'Alt Gr + 7', '}': 'Alt Gr + 0',
            '[': 'Alt Gr + 8', ']': 'Alt Gr + 9', '\\': 'Alt Gr + *', '@': 'Alt Gr + Q',
            'B': 'SHIFT + B', 'i': 'Klavye i tuşu', 'l': 'Klavye l tuşu', 'F': 'SHIFT + F', 'E': 'SHIFT + F', 'n': 'Klavye n tuşu',
            '2.sınıf': 'S harfi için SHIFT kullan (2.sınıf yazın)', 'Bilişim': 'B harfi için SHIFT kullan', 'TEKNOLOJİ': 'Caps Lock açarak yaz'
        };

        // --- STATE VARIABLES ---
        let currentLevelIndex = 0;
        let currentTargetIndex = 0;
        let score = 0;
        let isPlaying = false;

        // --- DOM ELEMENTS ---
        const els = {
            menuScreen: document.getElementById('menuScreen'),
            gameScreen: document.getElementById('gameScreen'),
            successScreen: document.getElementById('successScreen'),
            targetSequence: document.getElementById('targetSequence'),
            gameInput: document.getElementById('gameInput'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            levelDisplay: document.getElementById('levelDisplay'),
            mainActionBtn: document.getElementById('mainActionBtn'),
            mainActionText: document.getElementById('mainActionText'),
            boardPlaqueTitle: document.getElementById('boardPlaqueTitle'),
            hintBox: document.getElementById('hintBox'),
            hintText: document.getElementById('hintText')
        };

        // --- CORE FUNCTIONS ---
        function updateScore(points) {
            score += points;
            els.scoreDisplay.textContent = score;
        }

        function showMenu() {
            isPlaying = false;
            els.menuScreen.classList.remove('hidden');
            els.gameScreen.classList.add('hidden');
            els.gameScreen.classList.remove('flex');
            els.successScreen.classList.add('hidden');
            els.successScreen.classList.remove('flex');
            
            if (els.boardPlaqueTitle) {
                els.boardPlaqueTitle.textContent = &quot;SHIFT &amp; Alt Gr Gizemlerini Çöz!&quot;;
            }
            els.mainActionText.textContent = &quot;Etkinliğe Başla&quot;;
            els.mainActionBtn.onclick = () =&gt; startLevel(1);

            const backBtn = document.getElementById('backBtn');
            const bottomNavBar = document.getElementById('bottomNavBar');
            if(backBtn) { backBtn.classList.add('hidden'); backBtn.classList.remove('flex'); }
            if(bottomNavBar) { bottomNavBar.classList.add('justify-center'); bottomNavBar.classList.remove('justify-between'); }
        }

        function startLevel(levelNum) {
            isPlaying = true;
            currentLevelIndex = levelNum - 1;
            if(currentLevelIndex &gt;= levels.length) currentLevelIndex = 0;
            
            const level = levels[currentLevelIndex];
            currentTargetIndex = 0;
            
            els.levelDisplay.textContent = level.id;
            if (els.boardPlaqueTitle) {
                els.boardPlaqueTitle.textContent = level.title;
            }
            els.gameInput.value = '';
            els.gameInput.className = 'type-input';
            
            if (level.id === 4) {
                els.gameInput.style.fontSize = &quot;2rem&quot;;
                els.gameInput.style.width = &quot;400px&quot;;
                els.gameInput.style.maxWidth = &quot;90vw&quot;;
            } else {
                els.gameInput.style.fontSize = &quot;3rem&quot;;
                els.gameInput.style.width = &quot;300px&quot;;
                els.gameInput.style.maxWidth = &quot;none&quot;;
            }
            
            els.hintBox.classList.add('hidden');
            renderTargets();

            els.menuScreen.classList.add('hidden');
            els.successScreen.classList.add('hidden');
            els.successScreen.classList.remove('flex');
            els.gameScreen.classList.remove('hidden');
            els.gameScreen.classList.add('flex');

            els.mainActionText.textContent = &quot;Baştan Başla&quot;;
            els.mainActionBtn.onclick = () =&gt; startLevel(levelNum);

            const backBtn = document.getElementById('backBtn');
            const bottomNavBar = document.getElementById('bottomNavBar');
            if(backBtn) { backBtn.classList.remove('hidden'); backBtn.classList.add('flex'); }
            if(bottomNavBar) { bottomNavBar.classList.remove('justify-center'); bottomNavBar.classList.add('justify-between'); }

            setTimeout(() =&gt; els.gameInput.focus(), 100);
        }

        function renderTargets() {
            const level = levels[currentLevelIndex];
            els.targetSequence.dataset.level = String(level.id);
            els.targetSequence.innerHTML = '';

            if (level.id === 4) {
                els.targetSequence.className = &quot;flex flex-wrap justify-center gap-2 mb-4 w-full px-4 overflow-y-auto max-h-[35vh] content-start&quot;;
            } else {
                els.targetSequence.className = &quot;flex flex-nowrap justify-center gap-1 sm:gap-2 md:gap-3 mb-10 w-full px-2 overflow-visible&quot;;
            }

            level.targets.forEach((char, index) =&gt; {
                const div = document.createElement('div');
                div.textContent = char;
                div.dataset.kind = char.length &gt; 3 ? 'word' : 'letter';
                div.id = `target-${index}`;
                div.className = `game-target ${index === 0 ? 'active' : ''}`;
                
                if (level.id === 4) {
                    div.style.fontSize = &quot;clamp(1rem, 1.5vw, 1.2rem)&quot;;
                    div.style.height = &quot;auto&quot;;
                    div.style.minWidth = &quot;auto&quot;;
                    div.style.padding = &quot;6px 12px&quot;;
                } else if(char.length &gt; 3) {
                    div.style.fontSize = &quot;clamp(0.8rem, 1.5vw, 1.2rem)&quot;;
                }

                els.targetSequence.appendChild(div);
            });
        }

        function normalizeChar(c) {
            if (!c) return &quot;&quot;;
            if (['‘', '’', '´', '`', '′'].includes(c)) return &quot;'&quot;;
            if (['“', '”', '″'].includes(c)) return '&quot;';
            return c;
        }

        els.gameInput.addEventListener('input', (e) =&gt; {
            if (!isPlaying) return;

            const level = levels[currentLevelIndex];
            if (currentTargetIndex &gt;= level.targets.length) return;

            const expectedTarget = level.targets[currentTargetIndex];
            const val = els.gameInput.value;

            if (!val) {
                els.gameInput.className = 'type-input';
                els.hintBox.classList.add('hidden');
                const targetEl = document.getElementById(`target-${currentTargetIndex}`);
                if (targetEl) targetEl.className = 'game-target active';
                return;
            }

            let normalizedExpected = expectedTarget.split('').map(normalizeChar).join('');
            let normalizedVal = val.split('').map(normalizeChar).join('');

            let trimmedVal = normalizedVal;
            if(trimmedVal.length === 0) {
                els.gameInput.className = 'type-input';
                return;
            }

            if (expectedTarget.length &gt; 1 || level.id === 4) {
                let isCompleteMatch = trimmedVal === normalizedExpected;
                let isPartialMatch = false;

                if (!isCompleteMatch) {
                    if(normalizedExpected.startsWith(trimmedVal)) {
                        isPartialMatch = true;
                    }
                }

                if (isCompleteMatch) {
                    handleSuccess();
                } else if (isPartialMatch) {
                    els.gameInput.className = 'type-input';
                    els.hintBox.classList.add('hidden');
                    const targetEl = document.getElementById(`target-${currentTargetIndex}`);
                    if (targetEl) targetEl.className = 'game-target active';
                } else {
                    handleError(expectedTarget);
                }

            } else {
                let found = normalizedVal === normalizedExpected;

                if (found) {
                    handleSuccess();
                } else {
                    handleError(expectedTarget);
                }
            }
        });

        els.gameInput.addEventListener('keydown', (e) =&gt; {
            if(e.key === 'Backspace' &amp;&amp; els.gameInput.classList.contains('error')) {
                setTimeout(() =&gt; {
                    if(!els.gameInput.value) { 
                         els.gameInput.className = 'type-input';
                         els.hintBox.classList.add('hidden');
                         const t = document.getElementById(`target-${currentTargetIndex}`);
                         if(t) t.className = 'game-target active';
                    }
                }, 10);
            }

            if(e.key === 'Backspace' &amp;&amp; els.gameInput.classList.contains('success')) {
                e.preventDefault();
            }

            if(els.gameInput.classList.contains('success') &amp;&amp; e.key.length === 1) {
                els.gameInput.value = '';
                els.gameInput.className = 'type-input';
            }
        });

        function handleSuccess() {
            updateScore(10);

            els.gameInput.className = 'type-input success';
            els.hintBox.classList.add('hidden');

            const isTypingLevel = levels[currentLevelIndex].id === 4;
            const targetEl = document.getElementById(`target-${currentTargetIndex}`);

            if (targetEl) {
                targetEl.className = 'game-target success';
                targetEl.innerHTML = '&lt;i class=&quot;fas fa-check text-2xl md:text-5xl&quot;&gt;&lt;/i&gt;';

                setTimeout(() =&gt; {
                    targetEl.style.transform = 'scale(0)';
                    targetEl.style.opacity = '0';
                    setTimeout(() =&gt; targetEl.remove(), isTypingLevel ? 150 : 200);
                }, isTypingLevel ? 150 : 400); 
            }

            currentTargetIndex++;

            if (currentTargetIndex &gt;= levels[currentLevelIndex].targets.length) {
                setTimeout(showSuccessScreen, 400);
            } else {
                const nextTarget = document.getElementById(`target-${currentTargetIndex}`);
                if (nextTarget) nextTarget.className = 'game-target active';
            }

            setTimeout(() =&gt; {
                if(els.gameInput.classList.contains('success')) {
                    els.gameInput.value = ''; 
                    els.gameInput.className = 'type-input';
                }
            }, 400); 
        }

        function handleError(expectedChar) {
            els.gameInput.className = 'type-input error';

            const targetEl = document.getElementById(`target-${currentTargetIndex}`);
            if (targetEl) targetEl.className = 'game-target error';

            const hint = hintsMap[expectedChar];
            if (hint) {
                els.hintText.replaceChildren();
                const target = document.createElement('span');
                target.className = 'hint-target';
                target.textContent = expectedChar;
                const instruction = document.createElement('span');
                instruction.textContent = `Yapmak için ${hint} tuşlarına bas.`;
                els.hintText.append(target, instruction);
                els.hintBox.classList.remove('hidden');
            } else if (levels[currentLevelIndex].id === 4) {
                els.hintText.innerHTML = `Lütfen &lt;strong&gt;büyük/küçük harfe&lt;/strong&gt; ve &lt;strong&gt;noktalama işaretlerine&lt;/strong&gt; dikkat edin: &lt;br&gt;&lt;span class=&quot;text-xl bg-white px-3 py-1 rounded shadow mt-2 inline-block&quot;&gt;${expectedChar}&lt;/span&gt;`;
                els.hintBox.classList.remove('hidden');
            }
        }

        const showErrorWithHint = handleError;
        handleError = function(expectedChar) {
            showErrorWithHint(expectedChar);
            requestAnimationFrame(() =&gt; {
                if (els.hintBox.classList.contains('hidden')) return;
                const area = els.gameScreen.getBoundingClientRect();
                const hint = els.hintBox.getBoundingClientRect();
                if (hint.bottom &gt; area.bottom - 12) {
                    els.gameScreen.scrollTop += hint.bottom - area.bottom + 12;
                }
            });
        };

        function showSuccessScreen() {
            isPlaying = false;
            els.successScreen.classList.remove('hidden');
            els.successScreen.classList.add('flex');

            if (currentLevelIndex + 1 &lt; levels.length) {
                els.mainActionText.textContent = &quot;Sonraki Bölüm&quot;;
                els.mainActionBtn.onclick = () =&gt; {
                    startLevel(currentLevelIndex + 2);
                };
            } else {
                els.mainActionText.textContent = &quot;Ana Menüye Dön&quot;;
                els.mainActionBtn.onclick = () =&gt; {
                    showMenu();
                };
            }
        }

        els.gameInput.addEventListener('click', () =&gt; {
            const len = els.gameInput.value.length;
            els.gameInput.setSelectionRange(len, len);
        });

        showMenu();
    &lt;/script&gt;

&lt;/div&gt;

(() =&gt; {

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

    if (described) {

    } else {

    }
    if (ids.size === 0) {

    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    }

    void computePosition(trigger, floating, {

      .then(({ x, y }) =&gt; {
